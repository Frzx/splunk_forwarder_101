# Collect combined application logs and audit logs, including rotation backups.
# Collecting the per-level files too would duplicate application events.
[monitor:///mnt/doris-logs/doris_mcp_server_all.log*]
disabled = 0
index = main
sourcetype = doris:mcp
host = doris-mcp-server

[monitor:///mnt/doris-logs/doris_mcp_server_audit.log*]
disabled = 0
index = main
sourcetype = doris:mcp:audit
host = doris-mcp-server
